group = "com.adguard.trusttunnel.vpn_plugin"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

def flutterRoot = rootProject.ext.has('flutterRoot') ? rootProject.ext.flutterRoot : null
if (flutterRoot != null) {
    apply from: "$flutterRoot/packages/flutter_tools/gradle/flutter.gradle"
}

android {
    if (project.android.hasProperty("namespace")) {
        namespace = "com.adguard.trusttunnel.vpn_plugin"
    }
    compileSdk = 34
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = "1.8" }
    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }
    defaultConfig { minSdk = 21 }
}

dependencies {
    testImplementation("org.jetbrains.kotlin:kotlin-test")
    testImplementation("org.mockito:mockito-core:5.0.0")
    def ttClientVersion = rootProject.findProperty("ttClientVersion")
    if (ttClientVersion == null || ttClientVersion.toString().trim().isEmpty()) {
        throw new GradleException("ttClientVersion is required; download the pinned tt-client artifact first")
    }
    implementation("com.moreprivate.tt_mobile:tt-client-android:${ttClientVersion}")
}

allprojects {
    repositories {
        maven { url = uri("$rootDir/../third_party/tt-client-maven") }
        google()
        mavenCentral()
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Keep Flutter plugins with native code (for example jni) on the same
// side-by-side NDK as the application and local TrustTunnel adapter.
subprojects {
    afterEvaluate { project ->
        def androidExtension = project.extensions.findByName("android")
        if (androidExtension != null) {
            androidExtension.ndkVersion = "29.0.14206865"
        }
    }
}

subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}

plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader ->
        localProperties.load(reader)
    }
}

// Signing secrets live outside the checkout, under the user's MorePrivate
// configuration directory. The repo-local file is reserved for SDK/Flutter
// metadata and is never a signing source.
def signingProperties = new Properties()
def signingPropertiesFile = new File(System.getProperty("user.home"), ".config/moreprivate/tt-mobile/local.properties")
if (signingPropertiesFile.exists()) {
    signingPropertiesFile.withReader("UTF-8") { reader ->
        signingProperties.load(reader)
    }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode")
if (flutterVersionCode == null) {
    flutterVersionCode = "1"
}

def flutterVersionName = localProperties.getProperty("flutter.versionName")
if (flutterVersionName == null) {
    flutterVersionName = "1.0"
}


def getSigningProp = { String name ->
    def v = project.findProperty(name)
    if (v != null) return v.toString()
    v = signingProperties.getProperty(name)
    return v != null ? v.toString() : null
}

android {
    namespace = "com.moreprivate.tt_mobile"
    compileSdk = 36
    ndkVersion = "29.0.14206865"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.moreprivate.tt_mobile"
        // You can update the following values to match your application needs.
        // For more information, see: https://docs.flutter.dev/deployment/android#reviewing-the-gradle-build-configuration.
        minSdk = 26
        targetSdk = 36
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
        // Optional: -PttAbiFilters=arm64-v8a (comma-separated). Unset keeps
        // Flutter --split-per-abi and emulator x86_64 working.
        def abiFiltersProp = project.findProperty("ttAbiFilters")
        if (abiFiltersProp != null && !abiFiltersProp.toString().trim().isEmpty()) {
            ndk {
                abiFilters abiFiltersProp.toString().split(",").collect { it.trim() }.findAll { it }
            }
        }
    }

    // Release APKs must be signed with a fixed keystore so local and CI builds
    // replace each other on device. Set via the external MorePrivate signing
    // properties or ORG_GRADLE_PROJECT_signingConfigKey* (CI).
    def signingStorePath = getSigningProp("signingConfigKeyStorePath")
    def signingAlias = getSigningProp("signingConfigKeyAlias")
    def signingKeyPassword = getSigningProp("signingConfigKeyPassword")
    def signingStorePassword = getSigningProp("signingConfigKeyStorePassword")
    def hasReleaseSigning = signingStorePath != null && !signingStorePath.trim().isEmpty() \
        && signingAlias != null && !signingAlias.trim().isEmpty() \
        && signingKeyPassword != null && !signingKeyPassword.trim().isEmpty() \
        && signingStorePassword != null && !signingStorePassword.trim().isEmpty()

    if (hasReleaseSigning) {
        signingConfigs {
            release {
                keyAlias = signingAlias
                keyPassword = signingKeyPassword
                storeFile = rootProject.file(signingStorePath)
                storePassword = signingStorePassword
            }
        }
    }

    buildTypes {
        release {
            if (!hasReleaseSigning) {
                throw new GradleException(
                    "Release signing is required for replaceable APKs.\n" +
                    "Local:  cd tt-mobile && make aux-setup-android-signing\n" +
                    "        (keystore in \$HOME/.config/moreprivate/tt-mobile/, not the repo)\n" +
                    "CI:     secrets ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD,\n" +
                    "        ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD\n" +
                    "Or ORG_GRADLE_PROJECT_signingConfigKeyStorePath/Alias/Password/StorePassword."
                )
            }
            signingConfig signingConfigs.release
            // Prefer: flutter build apk --release --split-per-abi (or AAB).
        }
    }
}

flutter {
    source = "../.."
}
